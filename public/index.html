<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
	<meta name="description" content="AI 智能聊天 - 多助手对话平台"/>
	<meta name="theme-color" content="#667eea"/>
	<title>AI 智能聊天 - 多联系人版</title>
	
	<!-- 本地 CSS 资源 -->
	<link rel="stylesheet" href="/css/styles.css?v=2.0.0">
</head>
<body>
<div class="app-container">
	<div class="contact-sidebar">
		<div class="sidebar-header">
			<h2>💬 智能助手</h2>
			<button class="action-btn" id="openCreateModalBtn">➕ 新建</button>
		</div>
		<div class="contact-list" id="contactList"></div>
	</div>
	<div class="chat-main">
		<div class="chat-header" id="chatHeader">
			<div class="avatar avatar-service">🤖</div>
			<div class="chat-header-info">
				<div class="chat-header-name" id="chatName">请选择一个助手开始聊天</div>
				<div class="chat-header-status" id="chatStatus"></div>
				<span class="chat-header-badge">🤖 AI Powered</span>
			</div>
		</div>
		<div class="messages-area" id="messagesArea">
			<div class="empty-state"><h3>✨ 欢迎使用 AI 智能聊天</h3><p>在左侧选择一个 AI 助手开始对话！</p></div>
		</div>
		<div class="typing-indicator" id="typingIndicator">AI 正在思考...</div>
		<div class="input-area">
			<input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off"/>
			<button class="send-btn" id="sendBtn">发送</button>
		</div>
	</div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="loginModal">
	<div class="modal">
		<h3>🔐 用户登录</h3>
		<div class="form-group login-form">
			<label>用户名</label>
			<input type="text" id="loginUsername" placeholder="请输入用户名（默认：admin）"/>
		</div>
		<div class="form-group login-form">
			<label>密码</label>
			<input type="password" id="loginPassword" placeholder="请输入密码"/>
		</div>
		<div class="modal-actions">
			<button class="btn btn-secondary" onclick="__app.closeLoginModal()">取消</button>
			<button class="btn btn-primary" onclick="__app.performLogin()">登录</button>
		</div>
	</div>
</div>

<div class="modal-overlay" id="createModal">
	<div class="modal">
		<h3>➕ 创建 AI 助手</h3>
		<div class="form-group create-form">
			<label>助手名称 *</label>
			<input type="text" id="newContactName" placeholder="例如：李明"/>
		</div>
		<div class="form-group create-form">
			<label>首字缩写 *</label>
			<input type="text" id="newContactInitials" placeholder="例如：李" maxlength="2"/>
		</div>
		<div class="form-group create-form">
			<label>头像颜色</label>
			<select id="newContactColor">
				<option value="avatar-1">🟢 绿色</option>
				<option value="avatar-2">🟠 橙色</option>
				<option value="default">⚪ 灰色</option>
				<option value="avatar-service-custom" selected>🎨 自定义（紫渐变）</option>
			</select>
		</div>
		<div class="form-group create-form">
			<label>人设提示词 *</label>
			<textarea id="newContactPersona" placeholder="描述这个 AI 助手的性格特点和回复风格..."></textarea>
		</div>
		<div class="modal-actions">
			<button class="btn btn-secondary" onclick="__app.closeCreateModal()">取消</button>
			<button class="btn btn-primary" onclick="__app.createNewContact()">创建</button>
		</div>
	</div>
</div>

<!-- 本地 JS 资源 -->
<script src="/js/app.js?v=2.1.0"></script>
</body>
</html>
